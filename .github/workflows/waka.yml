name: Update Wakatime

# Renders content/wakatime.md from profile.md + Wakatime stats, commits it, then
# rebuilds and deploys the site in the same run. Deploying here (instead of
# relying on deploy.yml) is intentional: the action pushes with GITHUB_TOKEN,
# and GITHUB_TOKEN pushes do not trigger other workflows.
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/configure-pages@v6

      - name: Render Wakatime page
        uses: Twisuki/custom_waka_readme@v1
        with:
          profile_path: profile.md
          output_path: content/wakatime.md
          wakatime_api_key: ${{ secrets.WAKATIME_API_KEY }}
          commit_author: waka_bot
          commit_message: "chore: update wakatime stats"
          skip_commit: true

      - run: npm ci
      - run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v5
